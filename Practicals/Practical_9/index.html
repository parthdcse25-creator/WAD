
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Daily Planner</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-950 via-purple-800 to-fuchsia-700 flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-2xl">

        <h1 class="text-3xl font-bold text-center text-indigo-800 mb-2">
            TaskFlow
        </h1>

        <p class="text-center text-purple-500 mb-6">
            Plan Your Day, Achieve More!
        </p>

        <!-- Task Input -->
        <div class="flex gap-2 mb-5">

            <input
                type="text"
                id="taskInput"
                placeholder="Add your new activity..."
                class="flex-1 min-w-0 border border-indigo-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
            >

            <button
                onclick="addTask()"
                class="bg-indigo-700 text-white px-4 py-2 rounded-lg hover:bg-purple-800 transition">
                Add
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

        <p id="emptyMessage" class="text-center text-gray-400 mt-4">
            Your task list is empty. Add a task!
        </p>

        <p class="text-center text-xs text-purple-400 mt-6">
            Stay Focused • Stay Productive
        </p>

        <p class="text-center text-xs text-gray-400 mt-2">
            Designed by Parth Dhimole | USN: CS25036
        </p>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter an activity!");
                return;
            }

            let li = document.createElement("li");

            li.className = "flex items-center justify-between bg-indigo-50 p-3 rounded-lg border border-indigo-100";

            // Task Text
            let span = document.createElement("span");
            span.textContent = taskText;
            span.className = "flex-1 cursor-pointer text-gray-700";

            // Mark Task as Completed
            span.onclick = function () {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            };

            // Delete Button
            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Remove";
            deleteBtn.className = "bg-purple-600 text-white px-3 py-1 rounded hover:bg-purple-800 ml-3 transition";

            deleteBtn.onclick = function () {
                li.remove();
                updateMessage();
            };

            li.appendChild(span);
            li.appendChild(deleteBtn);

            document.getElementById("taskList").appendChild(li);

            input.value = "";

            updateMessage();
        }

        // Update Empty Message
        function updateMessage() {

            let taskList = document.getElementById("taskList");
            let emptyMessage = document.getElementById("emptyMessage");

            if (taskList.children.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }
        }

        // Add Task Using Enter Key
        document.getElementById("taskInput").addEventListener("keypress", function (event) {

            if (event.key === "Enter") {
                addTask();
            }

        });

    </script>

</body>
</html>
