<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculation</title>
</head>
<body>

<div>
    <h1>Practical No. 6</h1>
    <h3><u>Student Result Calculation</u></h3>

    <table border="5" cellspacing="3" cellpadding="3">
        <tr>
            <th>No.</th>
            <th>Subject Name</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Mathematics</td>
            <td><input type="number" id="s1" placeholder="Enter marks"></td>
        </tr>

        <tr>
            <td>2</td>
            <td>Computer Architecture</td>
            <td><input type="number" id="s2" placeholder="Enter marks"></td>
        </tr>

        <tr>
            <td>3</td>
            <td>Engineering Design</td>
            <td><input type="number" id="s3" placeholder="Enter marks"></td>
        </tr>

        <tr>
            <td>4</td>
            <td>Environmental Studies</td>
            <td><input type="number" id="s4" placeholder="Enter marks"></td>
        </tr>

        <tr>
            <td>5</td>
            <td>Data Structures</td>
            <td><input type="number" id="s5" placeholder="Enter marks"></td>
        </tr>

        <tr>
            <td colspan="3" align="center">
                <button type="button" onclick="calc()">Calculate Result</button>
            </td>
        </tr>
    </table>

    <h3>Total Score</h3>
    <h3 id="totalmarks"></h3>
    <hr>

    <h3>Percentage</h3>
    <h3 id="Percentage"></h3>
    <hr>

    <h3>Final Grade</h3>
    <h3 id="grade"></h3>
</div>

<script>
function calc() {
    let sub1 = Number(document.getElementById("s1").value);
    let sub2 = Number(document.getElementById("s2").value);
    let sub3 = Number(document.getElementById("s3").value);
    let sub4 = Number(document.getElementById("s4").value);
    let sub5 = Number(document.getElementById("s5").value);

    let grade = null;
    let total = sub1 + sub2 + sub3 + sub4 + sub5;
    let per = (total / 500) * 100;

    if (per >= 85) {
        grade = "A";
    } else if (per >= 65) {
        grade = "B";
    } else if (per >= 45) {
        grade = "C";
    } else {
        grade = "D";
    }

    document.getElementById("totalmarks").textContent = total;
    document.getElementById("Percentage").textContent = per.toFixed(2) + "%";
    document.getElementById("grade").textContent = grade;
}
</script>

</body>
</html>
