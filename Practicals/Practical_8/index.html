<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-teal-900 to-cyan-800 flex items-center justify-center">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-2xl">

        <h2 class="text-3xl font-bold text-center text-teal-900 mb-2">
            Student Registration
        </h2>

        <p class="text-center text-slate-500 mb-6">
            Create your student account
        </p>

        <form id="registrationForm">

            <!-- Name -->
            <label class="font-semibold text-slate-700">Student Name</label>
            <input type="text" id="name"
                class="w-full border border-slate-300 p-3 mb-4 mt-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                placeholder="Enter your name">

            <!-- Email -->
            <label class="font-semibold text-slate-700">Email</label>
            <input type="text" id="email"
                class="w-full border border-slate-300 p-3 mb-4 mt-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                placeholder="Enter your email">

            <!-- Password -->
            <label class="font-semibold text-slate-700">Password</label>

            <div class="relative mt-1 mb-2">
                <input type="password" id="password"
                    class="w-full border border-slate-300 p-3 pr-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                    placeholder="Enter password">

                <button type="button" id="showPassword"
                    class="absolute right-2 top-2 bg-teal-700 text-white px-3 py-1.5 rounded-md text-sm hover:bg-teal-800 transition">
                    Show
                </button>
            </div>

            <p class="text-xs text-slate-500 mb-4">
                Password must be at least 8 characters and contain a special symbol
                like <b>@, #, $, %</b>.
            </p>

            <!-- Mobile -->
            <label class="font-semibold text-slate-700">Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border border-slate-300 p-3 mb-5 mt-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                placeholder="Enter 10-digit mobile number">

            <!-- Register Button -->
            <button type="submit"
                class="w-full bg-gradient-to-r from-teal-700 via-cyan-700 to-teal-800 text-white p-3 rounded-lg font-semibold hover:from-teal-800 hover:via-cyan-800 hover:to-teal-900 transition">
                Register
            </button>

            <p id="message" class="mt-4 text-center font-medium"></p>

        </form>
    </div>


    <script>

        // Show / Hide Password
        document.getElementById("showPassword").onclick = function () {

            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                this.innerHTML = "Hide";
            } else {
                password.type = "password";
                this.innerHTML = "Show";
            }

        };


        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");


            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500 font-medium";
                return;
            }


            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500 font-medium";
                return;
            }


            // Password validation
            let specialSymbol = /[!@#$%^&*]/;

            if (password.length < 8 || !specialSymbol.test(password)) {
                message.innerHTML =
                    "Password must be at least 8 characters and contain a special symbol like @, #, $.";
                message.className = "mt-4 text-center text-red-500 font-medium";
                return;
            }


            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500 font-medium";
                return;
            }


            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-emerald-600 font-medium";

        };

    </script>

</body>
</html>
